name: license

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[all]'
          python -m pip install pip-licenses

      - name: Production licence inventory
        run: pip-licenses --format=json > licenses.json

      - name: Enforce licence policy
        run: python .github/scripts/check-licenses.py licenses.json

      - name: Build SBOM (CycloneDX)
        run: python .github/scripts/make-sbom.py licenses.json sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hkex-filing-scraper-sbom
          path: sbom.cdx.json
