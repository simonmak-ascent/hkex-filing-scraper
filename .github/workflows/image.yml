name: image

# Publish a node-built image to GHCR.
#
# The image is built on the node (the release artefacts are already there); this
# job only pushes, from a runner on that node, with the job's own short-lived
# GITHUB_TOKEN. No registry credential is stored on a host.
#
#   gh workflow run image.yml -f image=apg-web:20261027T022403
#   gh workflow run image.yml -f image=fv-py:20261027T015847 -f package=mcp

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Local image tag, e.g. apg-web:20261027T022403"
        required: true
        type: string
      package:
        description: "Optional sub-package for a second service in this repo"
        required: false
        type: string
      runner:
        description: "Runner label on the node that holds the image"
        required: true
        type: choice
        options: [apg-ecs-01, apg-ecs-02, apg-ecs-03]
        default: apg-ecs-01

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push and record the digest
        id: push
        run: |
          set -eu
          src="${{ inputs.image }}"
          case "$src" in *:*) ;; *) echo "image must be name:stamp (got $src)" >&2; exit 1 ;; esac
          repo="ghcr.io/${{ github.repository }}"
          [ -n "${{ inputs.package }}" ] && repo="$repo/${{ inputs.package }}"
          dst="$repo:${src#*:}"
          docker tag "$src" "$dst"
          # Several layers in flight: a single stream is window-limited on this
          # link, so this is what actually fills the pipe.
          docker push --max-concurrent-uploads 8 "$dst"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$dst")"
          echo "$digest"
          {
            echo "### published"
            echo ""
            echo '```'
            echo "$digest"
            echo '```'
            echo ""
            echo "Pin it in \`container.json\` as \`image: $digest\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
