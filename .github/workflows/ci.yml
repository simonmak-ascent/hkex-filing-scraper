name: CI
true:
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
jobs:
  lint:
    name: Lint & format
    runs-on:
    - self-hosted
    - apg-ci-04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install
      run: pip install -e ".[dev]"
    - name: ruff check
      run: ruff check
    - name: ruff format --check
      run: ruff format --check
  docs:
    name: Docs build
    runs-on:
    - self-hosted
    - apg-ci-04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install MkDocs Material
      run: pip install "mkdocs-material>=9.5"
    - name: Build
      run: mkdocs build --strict
    - name: Build the LLM full-text bundle
      run: python3 scripts/build_llms.py
  wheel:
    name: Installed wheel
    runs-on:
    - self-hosted
    - apg-ci-04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Build the wheel
      run: 'python -m pip install --quiet --upgrade build

        python -m build --wheel --outdir dist

        '
    - name: Install it into a clean environment
      run: 'python -m venv /tmp/wheel

        /tmp/wheel/bin/pip install --quiet dist/*.whl "pytest>=7" hypothesis responses duckdb

        '
    - name: Run the suite against the installed package
      run: "mkdir -p /tmp/wheel-tests\n# scripts/ and api/ are repository tooling (not shipped in the wheel) that some tests load.\ncp -R tests scripts api /tmp/wheel-tests/\ncd /tmp/wheel-tests\n/tmp/wheel/bin/python\
        \ -m pytest -q tests \\\n  --ignore=tests/test_docs_consistency.py \\\n  --ignore=tests/test_supply_chain.py \\\n  --ignore=tests/test_theme.py\n"
  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on:
    - self-hosted
    - apg-ci-04
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: pip install -e ".[dev,duckdb,mcp]"
    - name: pytest
      run: pytest -q
