name: app-cd
# Vendored, in-repo reusable CD (apg-infra is private -> no cross-repo workflow_call).
on:
  workflow_call:
    inputs:
      app: { type: string, required: true }
      runner: { type: string, required: false, default: apg-ecs-01 }
      e2e: { type: boolean, required: false, default: false }
concurrency:
  group: app-cd-${{ inputs.app }}
  cancel-in-progress: false
jobs:
  cd:
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner }}"]
    env:
      MANIFEST: ${{ github.workspace }}/.deploy/apps.yaml
      APP: ${{ inputs.app }}
      REPO_DIR: ${{ github.workspace }}
      KIND_DIR: ${{ github.workspace }}/.deploy/kinds
    steps:
      - uses: actions/checkout@v4
      - id: kind
        run: echo "kind=$(python3 -c "import yaml;d=yaml.safe_load(open('$MANIFEST'));print({a['name']:a['kind'] for a in d['apps']}['$APP'])")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" build
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: echo "host=$(bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" preview "$(date -u +%Y%m%dT%H%M%S)" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cd-preview
          message: "Preview (${{ inputs.app }}): https://${{ steps.preview.outputs.host }}"
      - name: Deploy to inactive slot
        if: github.event_name == 'push'
        id: deploy
        run: |
          CUR=$(cat "/srv/apps/$APP/active-slot" 2>/dev/null || echo blue)
          [ "$CUR" = blue ] && NEXT=green || NEXT=blue
          echo "slot=$NEXT" >> "$GITHUB_OUTPUT"
          bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" deploy "$NEXT"
      - name: Switch production traffic
        if: github.event_name == 'push'
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" switch "${{ steps.deploy.outputs.slot }}"
      - name: Smoke test
        if: github.event_name == 'push'
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" smoke
      - name: Rollback on failure
        if: failure() && github.event_name == 'push'
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" rollback
